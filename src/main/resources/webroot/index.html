<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookStore Admin</title>
    <!-- Vue 3.5.30 -->
    <script src="https://unpkg.com/vue@3.5.30/dist/vue.global.js"></script>
    <!-- Axios 1.13.6 -->
    <script src="https://unpkg.com/axios@1.13.6/dist/axios.min.js"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons 0.577.0 -->
    <script src="https://unpkg.com/lucide@0.577.0"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --danger: #ef4444;
            --success: #22c55e;
            --glass-blur: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        #app {
            width: 100%;
            max-width: 1000px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #818cf8, #c084fc);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border: none;
            font-size: 0.9rem;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--text-muted);
        }

        .btn-danger {
            background: transparent;
            color: var(--danger);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            min-width: 250px;
        }

        .search-input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border-radius: 12px;
            color: var(--text);
            outline: none;
            backdrop-filter: blur(var(--glass-blur));
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 18px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 1rem 1.5rem;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .isbn-badge {
            font-family: monospace;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
            color: var(--primary);
        }

        .actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 0.8rem 1rem;
            border-radius: 10px;
            color: var(--text);
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
        }

        /* Notifications */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            background: var(--card-bg);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .empty-state {
            padding: 4rem 2rem;
            text-align: center;
            color: var(--text-muted);
        }

        .loading-spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        [v-cloak] { display: none; }
    </style>
</head>
<body>
    <div id="app" v-cloak>
        <div class="header">
            <h1>Librareo.</h1>
            <button class="btn btn-primary" @click="openModal('add')">
                <i data-lucide="plus"></i> Add New Book
            </button>
        </div>

        <div class="controls">
            <div class="search-wrapper">
                <i data-lucide="search" class="search-icon"></i>
                <input 
                    type="text" 
                    class="search-input" 
                    placeholder="Find a book by ISBN or title..." 
                    v-model="searchQuery">
            </div>
            <button class="btn btn-outline" @click="fetchBooks">
                <i data-lucide="rotate-cw" :class="{'loading-spinner': loading}"></i> Refresh
            </button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>ISBN</th>
                        <th>Book Title</th>
                        <th style="text-align: right">Actions</th>
                    </tr>
                </thead>
                <tbody v-if="filteredBooks.length > 0">
                    <tr v-for="book in filteredBooks" :key="book.isbn">
                        <td><span class="isbn-badge">{{ book.isbn }}</span></td>
                        <td style="font-weight: 500;">{{ book.title }}</td>
                        <td class="actions">
                            <button class="btn btn-danger btn-sm" @click="deleteBook(book.isbn)">
                                <i data-lucide="trash-2"></i>
                            </button>
                            <button class="btn btn-outline btn-sm" @click="openModal('edit', book)">
                                <i data-lucide="edit-3"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div v-if="filteredBooks.length === 0 && !loading" class="empty-state">
                <i data-lucide="book-x" style="width: 48px; height: 48px; margin-bottom: 1rem; opacity: 0.3;"></i>
                <p>No books found. Try a different search or add a new one.</p>
            </div>
        </div>

        <!-- Add/Edit Modal -->
        <div class="modal-overlay" v-if="showModal" @click.self="closeModal">
            <div class="modal">
                <h2 style="margin-bottom: 1.5rem;">{{ modalType === 'add' ? 'Add New' : 'Edit' }} Book</h2>
                <div class="form-group">
                    <label>ISBN</label>
                    <input type="text" v-model="form.isbn" :disabled="modalType === 'edit'" placeholder="e.g. 100200300">
                </div>
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" v-model="form.title" placeholder="e.g. Vert.x Microservices">
                </div>
                <div class="modal-actions">
                    <button class="btn btn-outline" @click="closeModal">Cancel</button>
                    <button class="btn btn-primary" @click="saveBook">
                        {{ modalType === 'add' ? 'Create Book' : 'Update Book' }}
                    </button>
                </div>
            </div>
        </div>

        <!-- Notifications -->
        <div class="toast" v-if="notification" :style="{ borderColor: notification.type === 'error' ? 'var(--danger)' : 'var(--success)' }">
            <i :data-lucide="notification.type === 'error' ? 'alert-circle' : 'check-circle'" 
               :style="{ color: notification.type === 'error' ? 'var(--danger)' : 'var(--success)' }"></i>
            <span>{{ notification.message }}</span>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted, nextTick } = Vue;

        createApp({
            setup() {
                const books = ref([]);
                const searchQuery = ref('');
                const loading = ref(false);
                const showModal = ref(false);
                const modalType = ref('add'); // 'add' or 'edit'
                const notification = ref(null);
                const form = ref({ isbn: '', title: '' });

                const fetchBooks = async () => {
                    loading.value = true;
                    try {
                        const response = await axios.get('/books');
                        books.value = response.data;
                    } catch (error) {
                        showNotification('Failed to fetch books', 'error');
                    } finally {
                        loading.value = false;
                        await nextTick();
                        lucide.createIcons();
                    }
                };

                const filteredBooks = computed(() => {
                    if (!searchQuery.value) return books.value;
                    const query = searchQuery.value.toLowerCase();
                    return books.value.filter(b => 
                        b.title.toLowerCase().includes(query) || 
                        b.isbn.toString().includes(query)
                    );
                });

                const openModal = (type, book = null) => {
                    modalType.value = type;
                    if (type === 'edit' && book) {
                        form.value = { ...book };
                    } else {
                        form.value = { isbn: '', title: '' };
                    }
                    showModal.value = true;
                    nextTick(() => lucide.createIcons());
                };

                const closeModal = () => {
                    showModal.value = false;
                };

                const saveBook = async () => {
                    if (!form.value.isbn || !form.value.title) {
                        showNotification('Please fill all fields', 'error');
                        return;
                    }

                    try {
                        if (modalType.value === 'add') {
                            await axios.post('/books', {
                                isbn: parseInt(form.value.isbn),
                                title: form.value.title
                            });
                            showNotification('Book added successfully!');
                        } else {
                            // Note: JDBCMainVerticle currently uses InMemoryBookStore for PUT
                            await axios.put(`/books/${form.value.isbn}`, {
                                isbn: parseInt(form.value.isbn),
                                title: form.value.title
                            });
                            showNotification('Book updated (Note: In-memory only)');
                        }
                        closeModal();
                        fetchBooks();
                    } catch (error) {
                        const msg = error.response?.data?.error || 'Operation failed';
                        showNotification(msg, 'error');
                    }
                };

                const deleteBook = async (isbn) => {
                    if (!confirm('Are you sure you want to delete this book?')) return;
                    try {
                        await axios.delete(`/books/${isbn}`);
                        showNotification('Book deleted successfully');
                        fetchBooks();
                    } catch (error) {
                        showNotification('Delete failed', 'error');
                    }
                };

                const showNotification = (message, type = 'success') => {
                    notification.value = { message, type };
                    setTimeout(() => {
                        notification.value = null;
                    }, 3000);
                    nextTick(() => lucide.createIcons());
                };

                onMounted(() => {
                    fetchBooks();
                    lucide.createIcons();
                });

                return {
                    books, searchQuery, loading, showModal, modalType, 
                    notification, form, filteredBooks,
                    fetchBooks, openModal, closeModal, saveBook, deleteBook
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
